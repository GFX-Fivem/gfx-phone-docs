<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tip Jar</title>
    <!-- The SDK comes from the phone itself. -->
    <script src="https://cfx-nui-gfx-phone/web/build/sdk/gfx-phone-sdk.js"></script>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        font: calc(15px * var(--gfx-text-scale, 1)) / 1.35 -apple-system, Inter, system-ui, sans-serif;
        color: var(--gfx-label, #000);
        background: transparent;
        /* Clear of the status bar / island and the home indicator. */
        padding: 60px 18px 40px;
      }
      ::-webkit-scrollbar { display: none; }
      h1 { font-size: calc(32px * var(--gfx-text-scale, 1)); margin: 0 0 4px; }
      p { color: var(--gfx-label-secondary, #666); margin: 0 0 20px; }
      .card { background: var(--gfx-background, #fff); border-radius: 16px; padding: 14px; margin-bottom: 14px; }
      input { width: 100%; font: inherit; color: inherit; border: 0; border-radius: 10px; padding: 10px 12px; background: var(--gfx-fill, #eee); }
      button { width: 100%; font: inherit; font-weight: 600; border: 0; border-radius: 999px; padding: 12px; margin-top: 10px; color: #fff; background: #ff8a00; cursor: pointer; }
      button.secondary { background: var(--gfx-fill, #eee); color: var(--gfx-tint, #0a84ff); }
      img { width: 100%; border-radius: 12px; margin-top: 10px; display: none; }
    </style>
  </head>
  <body>
    <h1>Tip Jar</h1>
    <p id="hello">…</p>

    <div class="card">
      <input id="target" inputmode="numeric" placeholder="Performer's server id" />
      <input id="amount" inputmode="decimal" placeholder="Amount" style="margin-top: 8px" />
      <button id="tip">Send tip</button>
    </div>

    <div class="card">
      <button class="secondary" id="live">Go live (Lemon Pulse)</button>
      <button class="secondary" id="photo">Take a photo</button>
      <img id="shot" alt="" />
    </div>

    <script src="app.js"></script>
  </body>
</html>
